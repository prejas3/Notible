[package]
name = "notible"
version = "0.97.0"
description = "Notible — a local knowledge OS"
authors = ["you"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "notible_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "7.2.0", default-features = false, features = ["deflate-flate2"] }
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
url = "2"
# Already in the tree as a transitive dependency of `url`; named directly so
# the `plugin:` scheme handler can decode request paths.
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tiny_http = "0.12"
keyring = { version = "3", features = ["windows-native"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
calamine = "0.36.0"
rust_xlsxwriter = "0.96.0"
